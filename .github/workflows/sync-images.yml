name: Sync Docker Hub Images to Alibaba ACR

on:
  schedule:
    # Every day at 02:00 UTC = 10:00 Beijing time
    - cron: "0 2 * * *"

  push:
    branches:
      - main
    paths:
      - "images.txt"
      - ".github/workflows/sync-images.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docker-hub-to-acr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Check and sync images
        id: sync
        shell: bash
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p state

          UPDATED="$RUNNER_TEMP/updated.txt"
          UNCHANGED="$RUNNER_TEMP/unchanged.txt"
          FAILED="$RUNNER_TEMP/failed.txt"
          AUTH_FILE="$RUNNER_TEMP/containers-auth.json"

          : > "$UPDATED"
          : > "$UNCHANGED"
          : > "$FAILED"

          # Validate required secrets without printing their values.
          if [[ -z "${ACR_REGISTRY:-}" ||
                -z "${ACR_NAMESPACE:-}" ||
                -z "${ACR_USERNAME:-}" ||
                -z "${ACR_PASSWORD:-}" ]]; then
            echo "Missing required ACR GitHub Secrets." >> "$FAILED"
            echo "错误：ACR 配置不完整，请检查 GitHub Secrets。"
            exit 1
          fi

          # Normalize registry address.
          ACR_REGISTRY="${ACR_REGISTRY#https://}"
          ACR_REGISTRY="${ACR_REGISTRY#http://}"
          ACR_REGISTRY="${ACR_REGISTRY%/}"

          # Initialize digest state.
          if [[ ! -f state/digests.json ]]; then
            echo '{}' > state/digests.json
          fi

          if ! python3 -m json.tool state/digests.json >/dev/null 2>&1; then
            echo "state/digests.json is invalid JSON" >> "$FAILED"
            echo "错误：state/digests.json 格式无效。"
            exit 1
          fi

          # Login to ACR.
          if ! printf '%s' "$ACR_PASSWORD" |
            skopeo login \
              --authfile "$AUTH_FILE" \
              --username "$ACR_USERNAME" \
              --password-stdin \
              "$ACR_REGISTRY"; then
            echo "ACR login failed; check registry credentials and permissions." >> "$FAILED"
            echo "错误：ACR 登录失败，请检查地址、账号和密码。"
            exit 1
          fi

          # Read a saved digest by source image name.
          get_saved_digest() {
            python3 - "$1" <<'PY'
          import json
          import sys

          key = sys.argv[1]
          with open("state/digests.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data.get(key, ""))
          PY
          }

          # Save a digest only after a successful copy.
          save_digest() {
            python3 - "$1" "$2" <<'PY'
          import json
          import os
          import sys

          key, digest = sys.argv[1], sys.argv[2]
          path = "state/digests.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          data[key] = digest
          temp = path + ".tmp"

          with open(temp, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write("\n")

          os.replace(temp, path)
          PY
          }

          # Detect flattened target-name collisions.
          declare -A TARGET_OWNER=()

          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            line="$(echo "$line" | xargs)"

            [[ -z "$line" || "$line" == \#* ]] && continue

            # Only accept Docker Hub image references:
            # image[:tag] or namespace/image[:tag].
            if [[ "$line" == *@* ||
                  "$line" == */*/* ||
                  ! "$line" =~ ^[a-zA-Z0-9._/-]+(:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127})?$ ]]; then
              echo "$line - invalid image reference" >> "$FAILED"
              echo "无效的镜像名称：$line"
              continue
            fi

            # Default tag to latest.
            if [[ "${line##*/}" != *:* ]]; then
              line="${line}:latest"
            fi

            # Normalize Docker Hub source.
            if [[ "$line" != */* ]]; then
              SOURCE="docker.io/library/$line"
            else
              SOURCE="docker.io/$line"
            fi

            # ACR only supports namespace/image:tag.
            # Flatten the Docker Hub path to its final image component.
            IMAGE_NAME="${line##*/}"
            TARGET="$ACR_REGISTRY/$ACR_NAMESPACE/$IMAGE_NAME"

            # Prevent two different source images from overwriting
            # the same flattened ACR target during this run.
            if [[ -n "${TARGET_OWNER[$TARGET]:-}" &&
                  "${TARGET_OWNER[$TARGET]}" != "$line" ]]; then
              echo "$line - target collision: $TARGET is also used by ${TARGET_OWNER[$TARGET]}" >> "$FAILED"
              echo "目标镜像冲突：$line -> $TARGET"
              continue
            fi
            TARGET_OWNER["$TARGET"]="$line"

            echo ""
            echo "===================================="
            echo "Source: $SOURCE"
            echo "Target: $TARGET"

            # Fetch the raw top-level manifest/index.
            # Check the command separately so failures are not
            # accidentally converted into a digest of empty input.
            RAW_FILE="$RUNNER_TEMP/source-manifest.json"

            if ! skopeo inspect --raw "docker://$SOURCE" > "$RAW_FILE"; then
              echo "$line - Docker Hub inspection failed" >> "$FAILED"
              echo "获取源镜像信息失败：$line"
              continue
            fi

            if [[ ! -s "$RAW_FILE" ]] ||
               ! python3 -m json.tool "$RAW_FILE" >/dev/null 2>&1; then
              echo "$line - source manifest is empty or invalid" >> "$FAILED"
              echo "源镜像返回的 Manifest 为空或格式无效：$line"
              continue
            fi

            SOURCE_DIGEST="sha256:$(sha256sum "$RAW_FILE" | awk '{print $1}')"

            if ! SAVED_DIGEST="$(get_saved_digest "$line")"; then
              echo "$line - failed to read saved digest" >> "$FAILED"
              echo "读取历史 Digest 失败：$line"
              continue
            fi

            # Skip unchanged images.
            if [[ -n "$SAVED_DIGEST" &&
                  "$SOURCE_DIGEST" == "$SAVED_DIGEST" ]]; then
              echo "Unchanged: $line"
              echo "$line" >> "$UNCHANGED"
              continue
            fi

            echo "Changed or first sync: $line"

            # Copy all architectures.
            if skopeo copy \
              --override-os linux \
              --override-arch amd64 \
              --authfile "$AUTH_FILE" \
              "docker://$SOURCE" \
              "docker://$TARGET"; then
              echo "Skopeo copy 成功：$TARGET"

            else
              echo "Skopeo copy 失败，尝试 Docker pull/push：$SOURCE -> $TARGET"

              # 1. 登录目标镜像仓库
              if ! echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
                -u "$ACR_USERNAME" --password-stdin; then
                echo "$line - Docker target login failed" >> "$FAILED"
                echo "目标仓库 Docker 登录失败：$ACR_REGISTRY"
                continue
              fi

              # 3. 拉取 amd64 镜像
              if ! docker pull --platform linux/amd64 "$SOURCE"; then
                echo "$line - Docker pull failed" >> "$FAILED"
                echo "Docker pull 失败：$SOURCE"
                continue
              fi

              # 4. 重新打标签
              if ! docker tag "$SOURCE" "$TARGET"; then
                echo "$line - Docker tag failed" >> "$FAILED"
                echo "Docker tag 失败：$SOURCE -> $TARGET"
                continue
              fi

              # 5. 推送目标仓库
              if ! docker push "$TARGET"; then
                echo "$line - Docker push failed" >> "$FAILED"
                echo "Docker push 失败：$TARGET"
                continue
              fi

              echo "Docker pull/push 成功：$TARGET"
            fi

            if save_digest "$line" "$SOURCE_DIGEST"; then
              echo "Updated: $TARGET"
              echo "$line" >> "$UPDATED"

              # Add one GitHub Actions summary entry immediately per successful image sync.
              {
                echo "### 镜像同步成功"
                echo "- 源镜像：$SOURCE"
                echo "- 目标镜像：$TARGET"
                echo "- 架构：linux/amd64"
                echo "- Digest：$SOURCE_DIGEST"
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$line - failed to save digest" >> "$FAILED"
              echo "镜像已复制，但保存 Digest 失败：$line"
            fi
          
          done < images.txt

          # Commit and push the updated digest state.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/digests.json

          if ! git diff --cached --quiet; then
            if git commit -m "chore: update synced image digests"; then
              if ! git push origin HEAD:main; then
                echo "Failed to push digest state to GitHub" >> "$FAILED"
                echo "错误：Digest 状态提交到 GitHub 失败。"
              fi
            else
              echo "Failed to commit digest state" >> "$FAILED"
              echo "错误：Digest 状态提交失败。"
            fi
          fi

          echo ""
          echo "Updated: $(wc -l < "$UPDATED")"
          echo "Unchanged: $(wc -l < "$UNCHANGED")"
          echo "Failed: $(wc -l < "$FAILED")"

          if [[ -s "$FAILED" ]]; then
            exit 1
          fi

      - name: Notify WeCom
        if: always()
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])

          def read_items(name):
              path = root / name
              if not path.exists():
                  return []
              return [
                  line.strip()
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]

          updated = read_items("updated.txt")
          unchanged = read_items("unchanged.txt")
          failed = read_items("failed.txt")
          status = os.environ.get("JOB_STATUS", "unknown")

          lines = []

          if status != "success":
              lines.append("镜像同步任务失败，请检查 GitHub Actions 日志。")
              lines.append("")

          if updated:
              lines.append("已更新镜像：")
              lines.extend(updated)
              lines.append("")

          if unchanged:
              lines.append("无需更新镜像：")
              lines.extend(unchanged)
              lines.append("")

          if failed:
              lines.append("同步失败：")
              lines.extend(failed)
              lines.append("")

          if not updated and not unchanged and not failed:
              if status == "success":
                  lines.append("本次没有需要同步的镜像。")
              else:
                  lines.append("任务在完成镜像检查前失败，请查看 GitHub Actions 日志。")

          content = "\n".join(lines).strip()

          webhook = os.environ.get("WEBHOOK_URL", "")
          if not webhook:
              raise SystemExit("WECHAT_WEBHOOK_URL is not configured")

          payload = {
              "msgtype": "text",
              "text": {"content": content}
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              result = json.loads(response.read().decode("utf-8"))

          if result.get("errcode", 0) != 0:
              raise RuntimeError(f"WeCom notification failed: {result}")

          print("WeCom notification sent")
          PY
